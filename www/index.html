<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Silsila</title>
    <style>
      :root {
        color: #1c1c1a;
        background: #f5efe0;
        font-family: Georgia, "Times New Roman", serif;
      }

      body {
        align-items: center;
        background: #f5efe0;
        display: flex;
        min-height: 100vh;
        margin: 0;
        text-align: center;
      }

      main {
        margin: auto;
        max-width: 28rem;
        padding: 2rem;
      }

      h1 {
        font-size: 2.8rem;
        letter-spacing: 0.18em;
        margin: 1rem 0 0.5rem;
      }

      p {
        color: #6d5d3f;
        font-size: 1rem;
        line-height: 1.6;
      }

      nav {
        display: flex;
        gap: 1rem;
        justify-content: center;
        margin-top: 1.5rem;
      }

      a {
        color: #8c6828;
        text-decoration: none;
      }

      .quill {
        color: #c8a050;
        font-size: 2.5rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="quill" aria-hidden="true">✒</div>
      <h1>SILSILA</h1>
      <p>Urdu Poetry for the Diaspora</p>
      <p>The native iOS app loads the live Silsila experience from silsila-poetry.replit.app.</p>
      <nav aria-label="Legal">
        <a href="/privacy/">Privacy</a>
        <a href="/terms/">Terms</a>
      </nav>
    </main>
  </body>
</html>
